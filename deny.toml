# Review dependency licenses and sources for the MIT OR Apache-2.0 distribution.
# No advisory exceptions are accepted by default.
[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Existing, unmodified MPL dependencies remain separately licensed; see
# https://www.mozilla.org/en-US/MPL/2.0/FAQ/ (larger works).
exceptions = [
    { crate = "gdextension-api", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-bindings", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-cell", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-codegen", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-core", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-ffi", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-macros", allow = [
        "MPL-2.0",
    ] },
    { crate = "option-ext", allow = [
        "MPL-2.0",
    ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
