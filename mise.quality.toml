[tools]
# Formatting and lint tools share this environment in local commands and CI.
dprint = "0.58.0"
tombi = "1.7.3"
ruff = "0.16.10"
rumdl = "0.2.78"
shfmt = "3.14.1"
shellcheck = "0.11.0"
stylua = "2.5.2"
"github:oxc-project/oxc" = { version = "oxlint_v1.87.0", matching = "oxlint" }
"lua-language-server" = "3.19.1"
"pipx:gdtoolkit" = "4.5.0"
"pipx:djlint" = "1.46.4"
"pipx:clang-format" = "23.1.3"
"cargo:https://github.com/kamadorueda/alejandra" = { version = "tag:4.0.0", crate = "alejandra_cli" }
editorconfig-checker = "4.0.2"
powershell = "7.6.6"

[env]
DPRINT_CACHE_DIR = "{{config_root}}/target/dprint-cache"
RECITE_PSSA_VERSION = "1.25.0"

[tasks.quality-powershell-setup]
description = "Install the pinned Microsoft PowerShell formatter and analyzer"
run = "pwsh -NoProfile -File scripts/quality/powershell.ps1 setup"
