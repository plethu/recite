name: CI

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      lsp_sessions_only:
        description: Run the cross-platform LSP session matrix and CI policy checks
        type: boolean
        default: false
      lsp_server_control_ref:
        description: Optional historical server revision for alternating binary comparisons
        type: string
        default: ""
      lsp_native_trace:
        description: Compare native tracing enabled and disabled on each session runner
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' }}

jobs:
  changes:
    name: Select CI coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      flatpak-packages: ${{ steps.scope.outputs.flatpak-packages }}
      nix-packages: ${{ steps.scope.outputs.nix-packages }}
      release-plan: ${{ steps.scope.outputs.release-plan }}
      cli-packages: ${{ steps.scope.outputs.cli-packages }}
      editor-native: ${{ steps.scope.outputs.editor-native }}
      writer: ${{ steps.scope.outputs.writer }}
      hosts: ${{ steps.scope.outputs.hosts }}
      windows-publisher: ${{ steps.scope.outputs.windows-publisher }}
      docs: ${{ steps.scope.outputs.docs }}
      site: ${{ steps.scope.outputs.site }}
      editor: ${{ steps.scope.outputs.editor }}
      benchmark-smoke: ${{ steps.scope.outputs.benchmark-smoke }}
      maintainability: ${{ steps.scope.outputs.maintainability }}
      packages: ${{ steps.scope.outputs.packages }}
      lsp-sessions: ${{ steps.scope.outputs.lsp-sessions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install pinned CI routing runtime
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: python
      - id: scope
        name: Inspect complete changed-file list
        run: python3 scripts/ci-scope.py

  git-policy:
    name: Git workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request's default checkout is a synthetic merge commit. The
          # policy must inspect the source branch's actual commit range.
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # PR metadata and commit policy are checked by the base-owned trusted
      # workflow, including edits to titles, bodies and integration labels.
      - name: Check merged commit policy
        if: github.event_name == 'push'
        run: scripts/check-git-policy.sh

      - name: Install lightweight checkers
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: python uv typos aqua:rhysd/actionlint just aqua:jqlang/jq

      - name: Check spelling
        run: typos

      - name: Validate workflow syntax
        run: actionlint -shellcheck= -pyflakes=

      - name: Check CI selection and result contracts
        run: uv run --locked --no-python-downloads python -m unittest discover -s tests/ci -p 'test_*.py'

      - name: Check integration-mode policy fixtures
        run: bash tests/git-policy/check-integration.sh

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-checks.yml
    with:
      lane: core
      ref: ${{ inputs.ref || '' }}

  hosts:
    needs: changes
    if: needs.changes.outputs.hosts == 'true'
    uses: ./.github/workflows/rust-checks.yml
    with:
      lane: hosts
      ref: ${{ inputs.ref || '' }}

  writer:
    needs: changes
    if: needs.changes.outputs.writer == 'true'
    uses: ./.github/workflows/rust-checks.yml
    with:
      lane: writer
      ref: ${{ inputs.ref || '' }}

  editor-native:
    needs: changes
    if: needs.changes.outputs.editor-native == 'true'
    uses: ./.github/workflows/rust-checks.yml
    with:
      lane: editor-native
      ref: ${{ inputs.ref || '' }}

  release-plan:
    needs: changes
    if: needs.changes.outputs.release-plan == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_ENV: release
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust just github:crate-ci/cargo-release aqua:axodotdev/cargo-dist
      - run: just release plan

  windows-publisher:
    needs: changes
    if: needs.changes.outputs.windows-publisher == 'true'
    name: Windows publisher contract
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # This lane runs Cargo contracts only; Linux owns the quality tools.
          install_args: rust

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Windows publisher contracts
        run: >-
          cargo test --locked -p recite-cli --all-features --lib
          --test watch_build_publisher --test watch_build_publisher_safety

      - name: Run Windows user configuration contracts
        run: cargo test --locked -p recite-config

      - name: Run Windows LSP path and identity contracts
        run: >-
          cargo test --locked -p recite-lsp --lib
          windows_fallback_document_keys_preserve_volume_identity
          && cargo test --locked -p recite-lsp --lib
          windows_drive_and_unc_uri_shapes_are_stable

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # This lane provisions its tools explicitly; skip unrelated implicit installs.
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm python just

      - name: Verify documentation
        run: just web verify

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    name: Documentation browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm just

      - name: Verify documentation in browsers
        run: |
          just --dry-run web test-browser
          just web test-browser

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-browser-results
          path: docs-site/.browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  editor:
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    name: VS Code and Helix clients
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust node pnpm python aqua:BurntSushi/ripgrep

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install editor workspace metadata
        run: scripts/install-js-dependencies.sh

      - name: Check shared VS Code/VSCodium client and package
        run: scripts/check-vscode.sh

      - name: Check Helix language configuration
        run: scripts/check-helix.sh

      - name: Check Helix checker hostile fixtures
        run: tests/editor-hosts/helix/check.sh

  benchmark-smoke:
    needs: changes
    if: needs.changes.outputs.benchmark-smoke == 'true'
    # Tiny benchmark execution plus a paired, confirmed LSP latency comparison.
    name: Benchmarks and LSP regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust python uv just

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run benchmark smoke
        run: scripts/benchmark-smoke.sh

      - name: Compare LSP performance against the change base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$EVENT_BASE" || "$EVENT_BASE" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git merge-base "$EVENT_BASE" HEAD)"
          fi
          just perf setup
          just perf compare "$base"

      - name: Retain LSP measurement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lsp-performance
          path: target/lsp-performance/*.json
          if-no-files-found: warn
          retention-days: 30

  maintainability:
    needs: changes
    if: needs.changes.outputs.maintainability == 'true'
    name: Maintainability
    runs-on: ubuntu-24.04
    # Cold pinned-tool installation and the complete quality lane need more than ten minutes.
    timeout-minutes: 30
    env:
      # Lanes running structural policy checks use this scoped environment,
      # which installs ast-grep.
      MISE_ENV: maintainability,quality
      RECITE_BASE_REF: >-
        ${{ github.event_name == 'pull_request' &&
            format('origin/{0}', github.base_ref) || github.event.before }}
      RECITE_HEAD_REF: >-
        ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Check Just command layout
        run: |
          just --list
          just --dry-run web verify
          just --dry-run writer check
          just --dry-run editor zed fmt-check
          just --dry-run engines godot
          just --dry-run stress scale
          just --dry-run perf bench lsp
          just --dry-run perf check

      - name: Run maintainability checks
        run: just _check-quality

  cli-packages:
    needs: changes
    if: needs.changes.outputs.cli-packages == 'true'
    uses: ./.github/workflows/cli-packages.yml
    with:
      ref: ${{ inputs.ref || '' }}

  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    uses: ./.github/workflows/writer-packages.yml
    with:
      ref: ${{ inputs.ref || '' }}
      native: true
      nix: false
      flatpak: false

  nix-packages:
    needs: changes
    if: needs.changes.outputs.nix-packages == 'true'
    uses: ./.github/workflows/writer-packages.yml
    with:
      ref: ${{ inputs.ref || '' }}
      native: false
      nix: true
      flatpak: false

  flatpak-packages:
    needs: changes
    if: needs.changes.outputs.flatpak-packages == 'true'
    uses: ./.github/workflows/writer-packages.yml
    with:
      ref: ${{ inputs.ref || '' }}
      native: false
      nix: false
      flatpak: true

  lsp-sessions:
    needs: changes
    if: needs.changes.outputs.lsp-sessions == 'true'
    uses: ./.github/workflows/lsp-sessions.yml
    with:
      server_ref: ${{ inputs.ref || '' }}
      server_control_ref: ${{ inputs.lsp_server_control_ref || '' }}
      native_trace: ${{ inputs.lsp_native_trace || false }}

  required-check:
    name: required-check
    if: always()
    needs:
      - changes
      - git-policy
      - rust
      - flatpak-packages
      - nix-packages
      - release-plan
      - cli-packages
      - editor-native
      - writer
      - hosts
      - docs
      - site
      - benchmark-smoke
      - maintainability
      - windows-publisher
      - editor
      - packages
      - lsp-sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Require every selected lane
        env:
          RECITE_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py
