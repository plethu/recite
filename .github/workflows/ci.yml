name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      windows-publisher: ${{ steps.scope.outputs.windows-publisher }}
      docs: ${{ steps.scope.outputs.docs }}
      editor: ${{ steps.scope.outputs.editor }}
      benchmark-smoke: ${{ steps.scope.outputs.benchmark-smoke }}
      maintainability: ${{ steps.scope.outputs.maintainability }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Inspect complete changed-file list
        run: python3 scripts/ci-scope.py

  git-policy:
    name: Git workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request's default checkout is a synthetic merge commit. The
          # policy must inspect the source branch's actual commit range.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # PR metadata and commit policy are checked by the base-owned trusted
      # workflow, including edits to titles, bodies and integration labels.
      - name: Check merged commit policy
        if: github.event_name == 'push'
        run: scripts/check-git-policy.sh

      - name: Install lightweight checkers
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: typos aqua:rhysd/actionlint

      - name: Check spelling
        run: typos

      - name: Validate workflow syntax
        run: actionlint -shellcheck= -pyflakes=

      - name: Check CI selection and result contracts
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py'

      - name: Check integration-mode policy fixtures
        run: bash tests/git-policy/check-integration.sh

      - name: Check pull-request rollup policy
        run: tests/check-pr-review-gates/check-rollup-fixtures.sh

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_ENV: maintainability
      RECITE_BASE_REF: >-
        ${{ github.event_name == 'pull_request' &&
            format('origin/{0}', github.base_ref) || github.event.before }}
      RECITE_HEAD_REF: >-
        ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install native writer build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config gettext cmake libgtk-3-dev libclang-dev libxkbcommon-x11-0 xvfb dbus-x11 python3-gi gir1.2-atspi-2.0 at-spi2-core

      - name: Run Rust and adapter gates
        run: scripts/check-project-gates.sh

      - name: Probe the Linux native accessibility bridge
        # Records current native limitations; --require-actions remains a
        # separate acceptance gate until the pinned host implements actions.
        run: xvfb-run -a just probe-writer-native-accessibility

  windows-publisher:
    needs: changes
    if: needs.changes.outputs.windows-publisher == 'true'
    name: Windows publisher contract
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # This lane runs Cargo contracts only; Linux owns the quality tools.
          install_args: rust

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Windows publisher contracts
        run: >-
          cargo test --locked -p recite-cli --all-features --lib
          --test watch_build_publisher --test watch_build_publisher_safety

      - name: Run Windows user configuration contracts
        run: cargo test --locked -p recite-config

      - name: Run Windows LSP path and identity contracts
        run: >-
          cargo test --locked -p recite-lsp --lib
          windows_fallback_document_keys_preserve_volume_identity
          && cargo test --locked -p recite-lsp --lib
          windows_drive_and_unc_uri_shapes_are_stable

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm

      - name: Verify documentation
        run: scripts/check-docs.sh

  editor:
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    name: VS Code and Helix clients
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust node pnpm aqua:BurntSushi/ripgrep

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install editor workspace metadata
        run: scripts/install-js-dependencies.sh

      - name: Check shared VS Code/VSCodium client and package
        run: scripts/check-vscode.sh

      - name: Check Helix language configuration
        run: scripts/check-helix.sh

      - name: Check Helix checker hostile fixtures
        run: tests/editor-hosts/helix/check.sh

  benchmark-smoke:
    needs: changes
    if: needs.changes.outputs.benchmark-smoke == 'true'
    # This checks that the tiny benchmark targets build and execute. It does
    # not compare timings or enforce the performance thresholds in §19.8.
    name: Benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run benchmark smoke
        run: scripts/benchmark-smoke.sh

  maintainability:
    needs: changes
    if: needs.changes.outputs.maintainability == 'true'
    name: Maintainability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Lanes running structural policy checks use this scoped environment,
      # which installs ast-grep.
      MISE_ENV: maintainability
      RECITE_BASE_REF: >-
        ${{ github.event_name == 'pull_request' &&
            format('origin/{0}', github.base_ref) || github.event.before }}
      RECITE_HEAD_REF: >-
        ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Run maintainability checks
        run: |
          tests/maintainability/check.sh
          tests/ast-grep/check.sh
          tests/lint-suppressions/check.sh
          scripts/check-maintainability.sh
          scripts/check-ast-grep.sh
          scripts/check-lint-suppressions.sh
          just fmt-check
          just unused-deps
          just supply-chain

  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    uses: ./.github/workflows/writer-packages.yml

  required-check:
    name: required-check
    if: always()
    needs:
      - changes
      - git-policy
      - rust
      - docs
      - benchmark-smoke
      - maintainability
      - windows-publisher
      - editor
      - packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected lane
        env:
          RECITE_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py
