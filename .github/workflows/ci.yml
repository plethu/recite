name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-policy:
    name: Git workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RECITE_PR_TITLE: ${{ github.event.pull_request.title }}
      RECITE_PR_BODY: ${{ github.event.pull_request.body }}
      # Only the coordinator's final milestone PR carries this label and uses
      # an integration/<topic> head branch targeting main. Local checks may
      # set RECITE_INTEGRATION_PR=1 explicitly instead.
      RECITE_INTEGRATION_LABEL: >-
        ${{ github.event_name == 'pull_request' &&
            contains(github.event.pull_request.labels.*.name, 'workflow/integration') &&
            '1' || '0' }}
      RECITE_PR_BASE_REF: >-
        ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref || '' }}
      RECITE_INTEGRATION_PR: >-
        ${{ github.event_name == 'pull_request' &&
            contains(github.event.pull_request.labels.*.name, 'workflow/integration') &&
            startsWith(github.event.pull_request.head.ref, 'integration/') &&
            '1' || '0' }}
    steps:
      - name: Check out source change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request's default checkout is a synthetic merge commit. The
          # policy must inspect the source branch's actual commit range.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check branch and commit policy
        run: scripts/check-git-policy.sh

      - name: Check integration-mode policy fixtures
        run: bash tests/git-policy/check-integration.sh

      - name: Check pull-request rollup policy
        run: tests/check-pr-review-gates/check-rollup-fixtures.sh

  rust:
    name: Rust gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_ENV: maintainability
      RECITE_BASE_REF: >-
        ${{ github.event_name == 'pull_request' &&
            format('origin/{0}', github.base_ref) || github.event.before }}
      RECITE_HEAD_REF: >-
        ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Rust and adapter gates
        run: scripts/check-project-gates.sh

  windows-publisher:
    name: Windows publisher contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Run Windows publisher contracts
        run: >-
          cargo test --locked -p recite-cli --all-features --lib
          --test watch_build_publisher --test watch_build_publisher_safety

      - name: Run Windows LSP path and identity contracts
        run: >-
          cargo test --locked -p recite-lsp --lib
          windows_fallback_document_keys_preserve_volume_identity
          && cargo test --locked -p recite-lsp --lib
          windows_drive_and_unc_uri_shapes_are_stable

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Verify documentation
        run: scripts/check-docs.sh

  benchmark-smoke:
    # This checks that the tiny benchmark targets build and execute. It does
    # not compare timings or enforce the performance thresholds in §19.8.
    name: Benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run benchmark smoke
        run: scripts/benchmark-smoke.sh

  maintainability:
    name: Maintainability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Lanes running structural policy checks use this scoped environment,
      # which installs ast-grep.
      MISE_ENV: maintainability
      RECITE_BASE_REF: >-
        ${{ github.event_name == 'pull_request' &&
            format('origin/{0}', github.base_ref) || github.event.before }}
      RECITE_HEAD_REF: >-
        ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Run maintainability checks
        run: |
          tests/maintainability/check.sh
          tests/ast-grep/check.sh
          tests/lint-suppressions/check.sh
          scripts/check-maintainability.sh
          scripts/check-ast-grep.sh
          scripts/check-lint-suppressions.sh

  required-check:
    name: required-check
    if: always()
    needs:
      - git-policy
      - rust
      - docs
      - benchmark-smoke
      - maintainability
      - windows-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require project lanes
        env:
          BENCHMARK_RESULT: ${{ needs.benchmark-smoke.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          GIT_POLICY_RESULT: ${{ needs.git-policy.result }}
          MAINTAINABILITY_RESULT: ${{ needs.maintainability.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          WINDOWS_PUBLISHER_RESULT: ${{ needs.windows-publisher.result }}
        run: |
          test "$GIT_POLICY_RESULT" = success
          test "$RUST_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$BENCHMARK_RESULT" = success
          test "$MAINTAINABILITY_RESULT" = success
          test "$WINDOWS_PUBLISHER_RESULT" = success
