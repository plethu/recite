name: LSP channel handoff experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MISE_AUTO_INSTALL: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build isolated channel probe
        run: |
          mkdir -p target
          cargo bench --locked -p recite-benchmarks --bench channel_handoff --no-run --message-format=json > target/channel-build.jsonl
          python -c 'import json, pathlib; artifacts = [json.loads(line) for line in pathlib.Path("target/channel-build.jsonl").read_text().splitlines()]; binary = next(item["executable"] for item in artifacts if item.get("target", {}).get("name") == "channel_handoff" and item.get("executable")); pathlib.Path("target/channel-binary.txt").write_text(binary)'
      - name: Compare blocking and selected receives
        run: |
          python -m pip install -r scripts/lsp-session-requirements.txt
          python scripts/measure-lsp-channel-handoff.py --binary "$(cat target/channel-binary.txt)" --output target/lsp-channel/handoff.json
      - name: Retain raw handoff and CPU measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lsp-channel-${{ matrix.os }}
          path: target/lsp-channel/
          if-no-files-found: error
          retention-days: 30
