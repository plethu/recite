name: Rust contract checks

on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.lane }} contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MISE_ENV: maintainability
      PROPTEST_CASES: "256"
      RECITE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      RECITE_HEAD_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: contracts
          workspaces: ${{ inputs.lane == 'writer' && 'apps/writer -> target' || '. -> target' }}
      - name: Install native Writer dependencies
        if: inputs.lane == 'writer'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config gettext cmake libgtk-3-dev libclang-dev libxkbcommon-x11-0 xvfb dbus-x11 python3-gi gir1.2-atspi-2.0 at-spi2-core
      - name: Check selected contracts
        env:
          LANE: ${{ inputs.lane }}
        run: |
          case "$LANE" in
            core) just core-check; just coverage ;;
            hosts) just host-check ;;
            editor-native) just editor-native-check ;;
            writer) just writer check; just writer coverage; xvfb-run -a just writer probe-accessibility ;;
            *) echo "Unknown contract lane: $LANE" >&2; exit 1 ;;
          esac
      - name: Retain coverage evidence
        if: always() && (inputs.lane == 'core' || inputs.lane == 'writer')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-assurance-${{ inputs.lane }}
          path: |
            target/coverage/
            apps/writer/target/coverage/
          retention-days: 14

  mutations:
    name: Critical mutations ${{ matrix.shard }}/2
    if: inputs.lane == 'core'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PROPTEST_CASES: "256"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Check the complete critical scope
        env:
          SHARD: ${{ matrix.shard }}/2
        run: just mutants --shard "$SHARD" --jobs 2 --build-timeout 600
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: critical-mutants-${{ matrix.shard }}
          path: target/mutation/
          retention-days: 14
