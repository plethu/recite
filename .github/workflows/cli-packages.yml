name: CLI and LSP package previews

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

env:
  MISE_ENV: release
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  binaries:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust just python uv aqua:jqlang/jq aqua:axodotdev/cargo-dist ${{ runner.os == 'Windows' && 'powershell' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dist-${{ matrix.target }}
      - run: just release build '${{ matrix.target }}'
      - name: Run CLI and LSP from the distribution archives
        run: |
          mkdir -p target/candidate-smoke
          shopt -s nullglob
          for archive in target/distrib/*.tar.xz; do tar -xf "$archive" -C target/candidate-smoke; done
          for archive in target/distrib/*.zip; do
            ARCHIVE="$archive" pwsh -NoProfile -Command 'Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath target/candidate-smoke -Force'
          done
          cli=$(find target/candidate-smoke -type f \( -name recite -o -name recite.exe \))
          lsp=$(find target/candidate-smoke -type f \( -name recite-lsp -o -name recite-lsp.exe \))
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "recite-cli") | .version')
          test "$("$cli" --version)" = "recite $version"
          cargo run --locked -p recite-fixturegen -- --profile tiny --output target/candidate-fixture
          just perf setup
          just perf lsp session target/candidate-fixture --binary "$lsp" --edits 40 --interval-ms 20 --output target/candidate-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-cli-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.zip
            target/distrib/*.sha256
            target/distrib/*-dist-manifest.json
          if-no-files-found: error
          retention-days: 30
