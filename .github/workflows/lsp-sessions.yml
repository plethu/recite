name: LSP sessions

on:
  workflow_call:
    inputs:
      channel_probe:
        type: boolean
        default: false
      driver_control_ref:
        type: string
        default: ''
      server_control_ref:
        type: string
        default: ''
      native_trace:
        type: boolean
        default: false
      macos_yield_probe:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      channel_probe:
        description: Compare isolated Crossbeam blocking and selected receives
        type: boolean
        default: false
      driver_control_ref:
        description: Optional historical harness revision for alternating driver comparisons
        type: string
        default: ''
      server_control_ref:
        description: Optional historical server revision for alternating binary comparisons
        type: string
        default: ''
      native_trace:
        description: Compare native tracing enabled and disabled
        type: boolean
        default: false
      macos_yield_probe:
        description: Diagnostic alternate libpthread yield path on macOS server children only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sessions:
    name: LSP and editor sessions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The process-yield diagnostic is macOS-specific; ordinary CI keeps all three hosts.
        include: >-
          ${{ fromJSON(inputs.macos_yield_probe
            && '[{"os":"macos-15","recovery_budget_ms":75}]'
            || '[{"os":"ubuntu-24.04","recovery_budget_ms":20},{"os":"windows-2025","recovery_budget_ms":40},{"os":"macos-15","recovery_budget_ms":75}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Only the explicitly installed Rust, Node and pnpm tools belong to this lane.
      MISE_AUTO_INSTALL: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust node pnpm
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check out optional control
        if: inputs.driver_control_ref != '' || inputs.server_control_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.server_control_ref || inputs.driver_control_ref }}
          path: .lsp-session-control
          persist-credentials: false
      - name: Build release server and fixture generator
        run: cargo build --locked --release -p recite-lsp -p recite-fixturegen
      - name: Build optional control server
        if: inputs.server_control_ref != ''
        env:
          DRIVER_CONTROL_REF: ${{ inputs.driver_control_ref }}
        run: |
          if [[ -n "$DRIVER_CONTROL_REF" ]]; then
            echo "Choose either a server control or a historical driver control" >&2
            exit 1
          fi
          CARGO_TARGET_DIR="$PWD/target/lsp-session-control-build" cargo build --locked --release --manifest-path .lsp-session-control/Cargo.toml -p recite-lsp
      - name: Check incremental protocol transactions
        run: cargo test --locked --release -p recite-lsp --test stdio_incremental_sync --test stdio_trace
      - name: Prepare session and editor dependencies
        run: |
          python -m pip install -r scripts/lsp-session-requirements.txt
          pnpm install --frozen-lockfile
          pnpm --filter recite-vscode run build
      - name: Build and measure isolated channel handoffs
        if: inputs.channel_probe
        run: |
          cargo bench --locked -p recite-benchmarks --bench channel_handoff --no-run --message-format=json > target/channel-build.jsonl
          python -c 'import json, pathlib; artifacts = [json.loads(line) for line in pathlib.Path("target/channel-build.jsonl").read_text().splitlines()]; binary = next(item["executable"] for item in artifacts if item.get("target", {}).get("name") == "channel_handoff" and item.get("executable")); pathlib.Path("target/channel-binary.txt").write_text(binary)'
          python scripts/measure-lsp-channel-handoff.py --binary "$(cat target/channel-binary.txt)" --output target/lsp-sessions/channel-handoff.json
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libasound2t64 libnss3 libgbm1 libgtk-3-0
      - name: Exercise live resource and latency faults
        run: python scripts/check-lsp-session-faults.py --output target/lsp-sessions/faults.json
      - name: Exercise fixed working set and document churn
        env:
          DRIVER_CONTROL_REF: ${{ inputs.driver_control_ref }}
          SERVER_CONTROL_REF: ${{ inputs.server_control_ref }}
          NATIVE_TRACE: ${{ inputs.native_trace }}
          MACOS_YIELD_PROBE: ${{ inputs.macos_yield_probe }}
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          binary="$PWD/target/release/recite-lsp$suffix"
          control_binary="$PWD/target/lsp-session-control-build/release/recite-lsp$suffix"
          reports="$PWD/target/lsp-sessions"
          server_options=()
          if [[ "$RUNNER_OS" == macOS && "$MACOS_YIELD_PROBE" == true ]]; then
            server_options+=(--server-yield-to-zero 0)
          fi
          run_control() {
            if [[ -n "$SERVER_CONTROL_REF" ]]; then
              python scripts/measure-lsp-endurance.py --binary "$control_binary" --output "$reports/control/fixed-$round.json"
              python scripts/measure-lsp-endurance.py --binary "$control_binary" --output "$reports/control/churn-$round.json" --churn
            else
              (cd .lsp-session-control
                python scripts/measure-lsp-endurance.py --binary "$binary" --output "$reports/control/fixed-$round.json"
                python scripts/measure-lsp-endurance.py --binary "$binary" --output "$reports/control/churn-$round.json" --churn)
            fi
          }
          run_traced() {
            for mode in fixed churn; do
              trace_dir="$reports/native/$mode-$round"
              mkdir -p "$trace_dir"
              extra=()
              if [[ "$mode" == churn ]]; then extra+=(--churn); fi
              RECITE_LSP_TRACE_DIR="$trace_dir" python scripts/measure-lsp-endurance.py \
                --binary "$binary" --output "$reports/native/$mode-$round.json" "${extra[@]}" "${server_options[@]}"
            done
          }
          for round in 1 2 3; do
            if [[ "$NATIVE_TRACE" == true && $((round % 2)) == 1 ]]; then run_traced; fi
            if [[ -n "$DRIVER_CONTROL_REF$SERVER_CONTROL_REF" && $((round % 2)) == 1 ]]; then run_control; fi
            python scripts/measure-lsp-endurance.py --binary "$binary" --output "$reports/fixed-$round.json" "${server_options[@]}"
            python scripts/measure-lsp-endurance.py --binary "$binary" --output "$reports/churn-$round.json" --churn "${server_options[@]}"
            if [[ -n "$DRIVER_CONTROL_REF$SERVER_CONTROL_REF" && $((round % 2)) == 0 ]]; then run_control; fi
            if [[ "$NATIVE_TRACE" == true && $((round % 2)) == 0 ]]; then run_traced; fi
          done
      - name: Attribute native request boundaries
        if: inputs.native_trace
        run: python scripts/summarize-lsp-native-trace.py --reports target/lsp-sessions --output target/lsp-sessions/native-summary.json
      - name: Compare server recovery and CPU
        if: inputs.server_control_ref != ''
        run: python scripts/summarize-lsp-server-comparison.py --reports target/lsp-sessions --output target/lsp-sessions/server-comparison.json
      - name: Enforce repeated p95 recovery budget
        run: >-
          python scripts/check-lsp-session-recovery.py
          --reports target/lsp-sessions
          --budget-ms ${{ matrix.recovery_budget_ms }}
          --output target/lsp-sessions/recovery.json
      - name: Exercise rendered VS Code and document lifecycle
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          "target/release/recite-fixturegen$suffix" --profile large --output target/lsp-editor-project --summaries target/lsp-sessions/fixture.json
          command=(node tests/editor-hosts/vscode/run-matrix.mjs target/lsp-editor-project "target/release/recite-lsp$suffix" target/lsp-sessions/editor.json)
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a "${command[@]}"; else "${command[@]}"; fi
      - name: Retain checkpoint reports, traces and rendered frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lsp-sessions-${{ matrix.os }}
          path: target/lsp-sessions/
          if-no-files-found: error
          retention-days: 30
