name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared SemVer version, such as 0.2.0-beta.1 or 0.2.0-rc.1
        required: true
        type: string
      commit:
        description: Complete commit ID containing the prepared versions
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.version }}-${{ inputs.commit }}
  cancel-in-progress: false

env:
  MISE_ENV: release
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust just aqua:axodotdev/cargo-dist
      - id: identity
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          cargo run --locked -p recite-release -- candidate "$VERSION" "$COMMIT"
          printf 'commit=%s\n' "$COMMIT" >> "$GITHUB_OUTPUT"
          dist plan --output-format=json > target/candidate-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-plan
          path: target/candidate-plan.json
          if-no-files-found: error
          retention-days: 30

  verification:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  seal:
    needs: [plan, verification]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust aqua:axodotdev/cargo-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: candidate-cli-*
          path: target/distrib
          merge-multiple: true
      - name: Build global distribution metadata
        run: dist build --artifacts=global --output-format=json > target/candidate-dist-manifest.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: recite-writer-*-preview
          path: target/candidate/writer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-plan
          path: target
      - name: Bind every candidate artifact to its verified source
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          mkdir -p target/candidate/cli
          cp -r target/distrib/. target/candidate/cli/
          cp target/candidate-dist-manifest.json target/candidate/cli/dist-manifest.json
          cargo run --locked -p recite-release -- seal "$VERSION" "$COMMIT" target/candidate-plan.json target/candidate target/release-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-candidate
          path: target/candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-receipt
          path: target/release-receipt.json
          if-no-files-found: error
          retention-days: 30
