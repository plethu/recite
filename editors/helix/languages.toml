# Recite language support for Helix.
#
# Copy this file to ~/.config/helix/languages.toml, or to
# .helix/languages.toml for a project-local setup, only when that destination
# is absent. If it exists, merge the Recite language-server, language, and
# grammar tables and reconcile use-grammars as described in README.md. The
# language server remains the semantic authority; this file only registers the
# file type, syntax grammar, and LSP process.

use-grammars = { only = ["recite"] }

[language-server.recite-lsp]
command = "recite-lsp"
args = []
timeout = 20

[[language]]
name = "recite"
language-id = "recite"
scope = "source.recite"
injection-regex = "recite"
file-types = ["recite"]
roots = ["recite.project.toml"]
language-servers = ["recite-lsp"]
grammar = "recite"
indent = { tab-width = 2, unit = "  " }

[[grammar]]
name = "recite"
source = { git = "https://github.com/plethu/recite", rev = "074ced2aec7549d5c9e2b86f04ca2f2fab6d7e9c", subpath = "editors/recite-tree-sitter" }
