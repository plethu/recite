name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gates:
    runs-on: docker
    container:
      # Keep this tag aligned with `rust-version` in the workspace Cargo.toml
      # so MSRV drift fails loudly in CI.
      image: rust:1.96
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            gates-

      - name: Run project gates
        run: scripts/check-project-gates.sh
