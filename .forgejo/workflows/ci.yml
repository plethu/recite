name: ci

env:
  # Keep this aligned with `rust-version` in the workspace Cargo.toml so MSRV
  # drift fails loudly in CI.
  RUST_VERSION: "1.96"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gates:
    runs-on: docker
    container:
      # Node-based actions such as checkout/cache execute inside the job
      # container on Forgejo runners, so the image must provide Node 20.
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION" \
                --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version

      - name: Install cbindgen
        run: "$HOME/.cargo/bin/cargo install cbindgen --version 0.29.4 --locked"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            gates-rust-${{ env.RUST_VERSION }}-

      - name: Run project gates
        run: scripts/check-project-gates.sh
