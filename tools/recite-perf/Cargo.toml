[package]
name = "recite-perf"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.dist]
dist = false

[package.metadata.release]
release = false
shared-version = false

[features]
writer = ["dep:recite-writer-model"]

[dependencies]
clap.workspace = true
gungraun-summary = "=7.0.0"
serde_json.workspace = true
toml_edit.workspace = true
recite-writer-model = { path = "../../apps/writer/crates/authoring", version = "0.0.0", optional = true, features = [
    "benchmarks"
] }

[dev-dependencies]
gungraun = "=0.20.0"
recite-benchmarks = { path = "../../crates/recite-benchmarks", version = "0.1.0" }
recite-adapter.workspace = true
recite-compiler.workspace = true
recite-core.workspace = true
recite-lsp = { workspace = true, features = ["bench-support"] }
recite-runtime.workspace = true
recite-ui.workspace = true
lsp-types = "0.97.0"
tempfile.workspace = true

[[bench]]
name = "workflows"
harness = false

[[bench]]
name = "writer"
harness = false
required-features = ["writer"]

[[bench]]
name = "bound_text"
harness = false

[[bench]]
name = "authoring"
harness = false
required-features = ["writer"]

[lints]
workspace = true
