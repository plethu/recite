id: rust-inline-test-module
language: Rust
severity: error
files:
  - "crates/*/src/**/*.rs"
  - "crates/*/benches/**/*.rs"
  - "crates/*/examples/**/*.rs"
  - "apps/writer/crates/*/src/**/*.rs"
  - "apps/writer/crates/*/benches/**/*.rs"
  - "apps/writer/crates/*/examples/**/*.rs"
  - "editors/zed/src/**/*.rs"
  - "tools/*/src/**/*.rs"
ignores:
  - "**/src/tests.rs"
  - "**/src/**/tests.rs"
  - "**/src/tests/**"
message: Private tests must live in a module-local tests.rs sidecar.
note: |
  Keep #[cfg(test)] declarations as external `mod tests;` sidecars in production
  modules; restricted pub(super) or pub(crate) visibility may share private test
  support without exposing production internals. This
  keeps private test ownership visible and lets the test-organization gate
  apply the same rule without scanning test bodies as production code.
rule:
  all:
    - kind: mod_item
    - has:
        field: name
        regex: ^tests$
    - has:
        field: body
        kind: declaration_list
