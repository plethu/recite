id: rust-inline-test-module
language: Rust
severity: error
message: Private tests must live in a module-local tests.rs sidecar.
note: |
  Keep #[cfg(test)] declarations as `mod tests;` in production modules. This
  keeps private test ownership visible and lets the test-organization gate
  apply the same rule without scanning test bodies as production code.
rule:
  pattern: |
    mod tests {
      $$$BODY
    }
