# Writer-local patch of the registry package; provenance is recorded below.

[package]
edition = "2024"
name = "freya-code-editor"
version = "0.5.0-rc.10"
authors = ["Marc Espín <mespinsanz@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Composable Code Editor APIs for Freya"
homepage = "https://freyaui.dev/"
keywords = ["freya"]
categories = ["gui"]
license = "MIT"
repository = "https://github.com/marc2332/freya"

[package.metadata.recite]
upstream = "freya-code-editor 0.5.0-rc.10"
upstream-checksum = "500d0650d718398bf8d04d4c7395a3d8177b4002ba43b433ffe46094f86f2164"
patch-purpose = "Bound native editing syntax and width work to visible and affected lines."
removal-condition = "Replace with an upstream release preserving bounded edit work and the regression tests."

[lib]
name = "freya_code_editor"
path = "src/lib.rs"

[[test]]
name = "scroll"
path = "tests/scroll.rs"

[dependencies.freya-components]
version = "=0.5.0-rc.10"

[dependencies.async-channel]
version = "2.5.0"

[dependencies.freya-core]
version = "=0.5.0-rc.10"

[dependencies.freya-edit]
version = "=0.5.0-rc.10"

[dependencies.freya-engine]
version = "=0.5.0-rc.10"

[dependencies.ropey]
version = "1.6.1"

[dependencies.rustc-hash]
version = "2.1.1"

[dependencies.smallvec]
version = "1.15.1"

[dependencies.torin]
version = "=0.5.0-rc.10"

[dependencies.tree-sitter]
version = "0.26"

[dev-dependencies.recite-writer-grammar]
path = "../../crates/grammar"

[dev-dependencies.freya-testing]
version = "=0.5.0-rc.10"

[dev-dependencies.tree-sitter-rust]
version = "0.24"

[lints.clippy]
redundant_clone = "warn"

[workspace]

[patch.crates-io]
freya-core = { path = "../freya-core" }
