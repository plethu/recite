app-id: io.github.plethu.recite
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: recite-writer
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # A project can live anywhere the user has access, including mounted drives.
  - --filesystem=host
  # AccessKit reads screen-reader status on the session bus before using the
  # separately proxied accessibility bus.
  - --talk-name=org.a11y.Bus
  # Explicit, project-configured producers and editors run on the host.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: recite-writer
    buildsystem: simple
    build-options:
      env:
        PATH: /usr/lib/sdk/rust-stable/bin:/app/bin:/usr/bin
        CARGO_HOME: /run/build/recite-writer/cargo
        CARGO_NET_OFFLINE: "true"
    sources:
      # Local previews include the current checkout, including uncommitted GUI
      # work. A source release can replace this with a pinned archive source.
      - type: dir
        path: ../../../..
        skip:
          - .git
          - target
          - .flatpak-builder
          - apps/writer/target
          - editors/zed/target
          - node_modules
          - docs-site/node_modules
          - .venv
          - .turbo
      - cargo-sources.json
    build-commands:
      - cargo --offline --frozen build --manifest-path apps/writer/Cargo.toml -p recite-writer --release -j 4
      - install -Dm755 apps/writer/target/release/recite-writer /app/bin/recite-writer
      - install -Dm644 apps/writer/packaging/flatpak/io.github.plethu.recite.desktop /app/share/applications/io.github.plethu.recite.desktop
      - install -Dm644 apps/writer/packaging/flatpak/io.github.plethu.recite.metainfo.xml /app/share/metainfo/io.github.plethu.recite.metainfo.xml
      - install -Dm644 apps/writer/packaging/icons/recite-writer.svg /app/share/icons/hicolor/scalable/apps/io.github.plethu.recite.svg
      - install -Dm644 apps/writer/packaging/icons/recite-writer.png /app/share/icons/hicolor/512x512/apps/io.github.plethu.recite.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.plethu.recite/LICENSE
      - install -Dm644 LICENSE-MIT /app/share/licenses/io.github.plethu.recite/LICENSE-MIT
      - install -Dm644 LICENSE-APACHE /app/share/licenses/io.github.plethu.recite/LICENSE-APACHE
      - install -Dm644 apps/writer/assets/fonts/fraunces/OFL.txt /app/share/licenses/io.github.plethu.recite/fonts/Fraunces-OFL.txt
      - install -Dm644 apps/writer/assets/fonts/literata/OFL.txt /app/share/licenses/io.github.plethu.recite/fonts/Literata-OFL.txt
      - install -Dm644 apps/writer/assets/fonts/ibm-plex-sans/OFL.txt /app/share/licenses/io.github.plethu.recite/fonts/IBM-Plex-Sans-OFL.txt
      - install -Dm644 apps/writer/assets/fonts/ibm-plex-mono/OFL.txt /app/share/licenses/io.github.plethu.recite/fonts/IBM-Plex-Mono-OFL.txt
