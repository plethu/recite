[package]
name = "recite-writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
similar = "=2.7.0"
notify = "8.2.0"
recite-build = { path = "../../../../crates/recite-build" }
rfd = "=0.17.2"
atomic-write-file = "0.3.1"
accesskit = "0.24.1"
recite-writer-grammar = { path = "../grammar" }
freya = { version = "=0.5.0-rc.7", features = ["code-editor", "sdk", "router"] }
recite-writer-model.workspace = true
recite-runtime.workspace = true
# The same Skia package used by Freya; draw graph paths without raster SVG assets.
skia-safe = { package = "freya-skia-safe", version = "=0.100.0", default-features = false }

recite-ui = { path = "../../../../crates/recite-ui" }
recite-config = { path = "../../../../crates/recite-config" }
tempfile = "3"
unic-langid = "0.9"
language-tags = "0.3.2"
url = "2.5"
isolang = { version = "2.4", features = ["local_names", "list_languages"] }
wait-timeout = "0.2.1"
thiserror = "2"
recite-parser.workspace = true
recite-core = { path = "../../../../crates/recite-core" }
recite-compiler = { path = "../../../../crates/recite-compiler" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
recite-writer-model = { workspace = true, features = ["benchmarks"] }
freya-testing = "=0.5.0-rc.7"
