[package]
name = "recite-writer-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atomic-write-file = "0.3.1"
recite-compiler.workspace = true
recite-config = { path = "../../../../crates/recite-config", version = "0.1.0" }
recite-core.workspace = true
recite-writer-model.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
recite-writer-model = { workspace = true, features = ["benchmarks"] }
ropey = "=1.6.1"

[lints]
workspace = true
