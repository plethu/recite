[package]
name = "recite-writer-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bench]]
harness = false
name = "large_project"
required-features = ["benchmarks"]

[dependencies]
recite-compiler.workspace = true
recite-core.workspace = true
recite-parser.workspace = true
recite-runtime.workspace = true
# Keep the borrowed runtime session with its immutable compiled asset.
self_cell = "=1.3.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror.workspace = true
toml_edit = "0.25.12"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
dhat = "0.3.3"

[features]
benchmarks = []
heap-profile = ["benchmarks"]

[lints]
workspace = true
