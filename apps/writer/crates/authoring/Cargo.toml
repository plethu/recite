[package]
name = "recite-writer-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
toml_edit = "0.25.12"
# Keep the borrowed runtime session with its immutable compiled asset.
self_cell = "=1.3.0"
recite-compiler.workspace = true
recite-core.workspace = true
recite-parser.workspace = true
recite-runtime.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[lints]
workspace = true

[features]
benchmarks = []
heap-profile = ["benchmarks"]

[dev-dependencies]
dhat = "0.3.3"
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "large_project"
harness = false
required-features = ["benchmarks"]
