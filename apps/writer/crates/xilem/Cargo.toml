[package]
name = "recite-writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
accesskit_winit = { version = "=0.32.2", default-features = false }
masonry_winit = { version = "0.4.0", git = "https://github.com/plethu/xilem", rev = "23cd6b69a0e066a08de14857f22cf0e603ccb95d" }
recite-core.workspace = true
recite-compiler.workspace = true
recite-config = { path = "../../../../crates/recite-config", version = "0.1.0" }
recite-runtime.workspace = true
recite-writer-app.workspace = true
recite-writer-model.workspace = true
recite-writer-session.workspace = true
rfd = "=0.17.2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
usvg = { version = "=0.47.0", default-features = false }
xilem = { version = "0.4.0", git = "https://github.com/plethu/xilem", rev = "23cd6b69a0e066a08de14857f22cf0e603ccb95d", features = [
    "vello_cpu_fallback",
    "vello_cpu_multithreading",
] }

[dev-dependencies]
recite-writer-app = { workspace = true, features = ["test-support"] }
accesskit_atspi_common = "0.18.1"
atspi-common = { version = "0.13", default-features = false }
tempfile = "3"
masonry = { version = "0.4.0", git = "https://github.com/plethu/xilem", rev = "23cd6b69a0e066a08de14857f22cf0e603ccb95d", features = [
    "testing"
] }

[lints]
workspace = true
