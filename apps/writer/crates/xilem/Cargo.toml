[package]
name = "recite-writer-xilem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
accesskit_winit = { version = "=0.32.2", default-features = false }
masonry_winit = { version = "0.4.0", git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
recite-core.workspace = true
recite-compiler.workspace = true
recite-config = { path = "../../../../crates/recite-config", version = "0.1.0" }
recite-runtime.workspace = true
recite-writer-model.workspace = true
recite-writer-session.workspace = true
rfd = "=0.17.2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
usvg = { version = "=0.47.0", default-features = false }
xilem = { version = "0.4.0", git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }

[dev-dependencies]
accesskit_atspi_common = "0.18.1"
atspi-common = { version = "0.13", default-features = false }
tempfile = "3"
masonry = { version = "0.4.0", git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88", features = [
    "testing"
] }

[lints]
workspace = true
