[workspace]
resolver = "3"
exclude = ["vendor/xilem/*", "vendor/copypasta", "vendor/accesskit-atspi-common"]
members = ["crates/authoring", "crates/freya", "crates/grammar", "crates/session", "crates/xilem"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
recite-compiler = { path = "../../crates/recite-compiler", version = "0.1.0" }
recite-core = { path = "../../crates/recite-core", version = "0.1.0" }
recite-parser = { path = "../../crates/recite-parser", version = "0.1.0" }
recite-runtime = { path = "../../crates/recite-runtime", version = "0.1.0" }
recite-writer-model = { path = "crates/authoring", version = "0.0.0" }
recite-writer-session = { path = "crates/session", version = "0.0.0" }
thiserror = "2"

[workspace.lints.clippy]
absolute_paths = "warn"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.bench]
debug = "line-tables-only"

[profile.dev]
debug = 0

[patch.crates-io]
accesskit_atspi_common = { path = "vendor/accesskit-atspi-common" }
copypasta = { path = "vendor/copypasta" }
freya-code-editor = { path = "vendor/freya-code-editor" }
freya-core = { path = "vendor/freya-core" }

[patch."https://github.com/linebender/xilem"]
masonry = { path = "vendor/xilem/masonry" }
masonry_winit = { path = "vendor/xilem/masonry_winit" }
