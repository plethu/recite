[workspace]
resolver = "3"
members = ["crates/authoring", "crates/freya", "crates/grammar"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
recite-compiler = { path = "../../crates/recite-compiler" }
recite-core = { path = "../../crates/recite-core" }
recite-parser = { path = "../../crates/recite-parser" }
recite-runtime = { path = "../../crates/recite-runtime" }
recite-writer-model = { path = "crates/authoring" }
thiserror = "2"

[workspace.lints.clippy]
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.bench]
debug = "line-tables-only"

[profile.dev]
debug = 0
