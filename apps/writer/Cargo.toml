[workspace]
resolver = "3"
members = ["crates/authoring", "crates/grammar", "crates/session", "crates/xilem"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
recite-compiler = { path = "../../crates/recite-compiler", version = "0.1.0" }
recite-core = { path = "../../crates/recite-core", version = "0.1.0" }
recite-parser = { path = "../../crates/recite-parser", version = "0.1.0" }
recite-runtime = { path = "../../crates/recite-runtime", version = "0.1.0" }
recite-writer-model = { path = "crates/authoring", version = "0.0.0" }
recite-writer-session = { path = "crates/session", version = "0.0.0" }
thiserror = "2"

[workspace.lints.clippy]
absolute_paths = "warn"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.bench]
debug = "line-tables-only"

[profile.dev]
debug = 0

[patch.crates-io]
# Forked fixes; see RECITE.md on each branch.
accesskit_atspi_common = { git = "https://github.com/plethu/accesskit", rev = "9fa7febed546dd525f6bbe7291a397014d6528cf" }
accesskit_consumer = { git = "https://github.com/plethu/accesskit", rev = "9fa7febed546dd525f6bbe7291a397014d6528cf" }
copypasta = { git = "https://github.com/plethu/copypasta", rev = "98fba518cc6f6f97ba2fa87d82fb0390c69c7584" }
