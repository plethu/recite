<div class="theme-control" hidden>
  <label for="theme-select">{{ i18n "ui.theme" }}</label>
  <select id="theme-select"
          data-theme-select
          aria-label="{{ i18n "ui.theme" }}">
    <option value="auto">{{ i18n "ui.system" }}</option>
    <option value="light">{{ i18n "ui.light" }}</option>
    <option value="dark">{{ i18n "ui.dark" }}</option>
  </select>
</div>
