<div class="flex align-center justify-between gap">
  <input type="checkbox" class="toggle" id="menu-control" aria-label="Menu" />
  <label for="menu-control">
    <svg class="book-icon" aria-hidden="true">
      {{ partial "docs/icon" "menu" }}
    </svg>
  </label>
  {{ partial "docs/brand" . }}
  <input type="checkbox"
         class="toggle"
         id="toc-control"
         aria-label="Table of Contents" />
  <label for="toc-control">
    <svg class="book-icon" aria-hidden="true">
      {{ partial "docs/icon" "toc" }}
    </svg>
  </label>
</div>
