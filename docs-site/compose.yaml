services:
  browsers:
    build:
      context: ..
      dockerfile: docs-site/Dockerfile.playwright
    init: true
    ipc: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      CI: "1"
      HOME: /tmp
    volumes:
      - ./.browser-artifacts:/workspace/docs-site/.browser-artifacts
