["landing.write.title"]
other = "Write"

["landing.write.body"]
other = "Work in VS Code or VSCodium, Neovim, Zed, or the standalone Recite Writer. The CLI, language server, and workbench use the same project model for diagnostics, stable-ID edits, schema inspection, and preview."

["landing.write.link"]
other = "The authoring workflow"

["landing.check.title"]
other = "Check"

["landing.check.body"]
other = "Validate source and schema, compile assets, and run scenes against fixtures without opening the game. Traces record the path through a conversation. CI can check that compiled assets still match the files writers edit."

["landing.check.link"]
other = "Testing dialogue"

["landing.integrate.title"]
other = "Integrate"

["landing.integrate.body"]
other = "Load compiled assets in Bevy, Godot, or Unity. The game answers condition queries, presents dialogue, and carries out effect requests. Recite’s session snapshot records traversal state; your save system keeps it alongside the game state."

["landing.integrate.link"]
other = "Engine adapters"

["landing.localisation.title"]
other = "Keep the words editable"

["landing.localisation.body1"]
other = "Lines and choices have identities separate from their wording. You can revise a sentence without replacing the ID used by a translation or a runtime choice."

["landing.localisation.body2"]
other = "Localisation is optional. When you need it, extract gettext templates with source references and translator context, edit PO catalogues, and test locale and fallback behaviour against the same scene. Recite Writer includes catalogue editing; translation and editorial decisions remain with the people doing that work."

["landing.localisation.link"]
other = "Localising dialogue"

["landing.fit.title"]
other = "Where Recite fits"

["landing.fit.body1"]
other = "Recite fits projects that want dialogue in version control, checks outside the engine, and an explicit boundary between narrative source and game code. A project schema describes the conditions, effects, and metadata available to writers."

["landing.fit.body2"]
other = "That boundary takes some integration work. Your game supplies presentation, state, and effect handling. Recite’s workbench is source-first; a general visual node editor is outside v1."

["landing.fit.body3"]
other = "Existing dialogue projects also need a migration review: the importers handle documented subsets, and engine UI, scripts, and saves require separate decisions."

["landing.fit.link"]
other = "Choosing dialogue tools"

