[project]
name = "recite-maintainer-tools"
version = "0.0.0"
description = "External LSP measurements and regression checks for Recite maintainers"
requires-python = ">=3.12,<3.13"
dependencies = ["psutil==7.2.2"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
