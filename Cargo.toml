[workspace]
resolver = "3"
members = [
    "crates/recite-adapter",
    "crates/recite-benchmarks",
    "crates/recite-bevy",
    "crates/recite-build",
    "crates/recite-cli",
    "crates/recite-compiler",
    "crates/recite-config",
    "crates/recite-core",
    "crates/recite-ffi",
    "crates/recite-fixturegen",
    "crates/recite-godot",
    "crates/recite-import",
    "crates/recite-lsp",
    "crates/recite-parser",
    "crates/recite-playground",
    "crates/recite-runtime",
    "crates/recite-ui",
    "tools/recite-release",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
readme = "README.md"
repository = "https://github.com/plethu/recite"
license = "MIT OR Apache-2.0"

[workspace.metadata.recite]
# Exact paths let the mutation preflight reject stale or empty contract scopes.
critical_mutation_files = [
    "crates/recite-core/src/source_line_index.rs",
    "crates/recite-lsp/src/server/freshness.rs",
    "crates/recite-lsp/src/project_refresh/close.rs",
    "crates/recite-runtime/src/traversal/choice.rs",
    "crates/recite-runtime/src/session_serialization/pending_position.rs",
]

[workspace.dependencies]
# Maintained BSD-3-Clause atomic replacement primitive for Unix and Windows.
atomic-write-file = "0.3.1"
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_asset = { version = "=0.19.1", default-features = false }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_reflect = { version = "=0.19.1", default-features = false, features = ["std"] }
blake3 = "1.8.5"
clap = { version = "4.5.51", features = ["derive", "string"] }
compact_str = "0.8.1"
criterion = { version = "0.8.2", default-features = false, features = ["plotters"] }
crossterm = "0.29.0"
dirs = "6.0.0"
fluent-bundle = "0.15.3"
fluent-syntax = "0.11.1"
insta = { version = "1.47.2", default-features = false }
language-tags = "0.3.2"
memchr = "2.8.0"
notify = "8.2.0"
proptest = "1.11.0"
rand_chacha = { version = "0.10.0", default-features = false }
ratatui = "0.30.2"
recite-adapter = { path = "crates/recite-adapter", version = "0.1.0" }
recite-build = { path = "crates/recite-build", version = "0.1.0" }
recite-compiler = { path = "crates/recite-compiler", version = "0.1.0" }
recite-config = { path = "crates/recite-config", version = "0.1.0" }
recite-core = { path = "crates/recite-core", version = "0.1.0" }
recite-ffi = { path = "crates/recite-ffi", version = "0.7.0" }
recite-fixturegen = { path = "crates/recite-fixturegen", version = "0.1.0" }
recite-godot = { path = "crates/recite-godot", version = "0.1.0" }
recite-import = { path = "crates/recite-import", version = "0.1.0" }
recite-lsp = { path = "crates/recite-lsp", version = "0.1.0" }
recite-parser = { path = "crates/recite-parser", version = "0.1.0" }
recite-runtime = { path = "crates/recite-runtime", version = "0.1.0" }
recite-ui = { path = "crates/recite-ui", version = "0.1.0" }
rmp-serde = "1.3.1"
rpds = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
serde-value = "0.7.0"
tempfile = "3.23.0"
thiserror = "2"
toml = "0.9.8"
toml_edit = { version = "0.25.12", features = ["serde"] }
unic-langid = { version = "0.9.6", features = ["macros"] }
# Full Unicode case folding for conservative case-insensitive output identities.
unicase = "=2.7.0"
unicode-ident = "1.0.22"
# Unicode normalization for conservative case-insensitive output identities.
unicode-normalization = "0.1.25"
wasm-bindgen = "=0.2.128"

[workspace.lints.clippy]
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

[profile.dist]
inherits = "release"
lto = "thin"

# Mutation testing repeatedly relinks consumers; retain test checks without debug symbols.
[profile.mutants]
inherits = "test"
debug = 0
