[workspace]
members = [
    "crates/recite-benchmarks",
    "crates/recite-cli",
    "crates/recite-compiler",
    "crates/recite-config",
    "crates/recite-core",
    "crates/recite-ffi",
    "crates/recite-fixturegen",
    "crates/recite-godot",
    "crates/recite-lsp",
    "crates/recite-parser",
    "crates/recite-runtime",
    "crates/recite-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/plethu/recite"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
recite-core = { version = "0.1.0", path = "crates/recite-core" }
recite-ffi = { version = "0.5.0", path = "crates/recite-ffi" }
recite-parser = { version = "0.1.0", path = "crates/recite-parser" }
recite-compiler = { version = "0.1.0", path = "crates/recite-compiler" }
recite-config = { version = "0.1.0", path = "crates/recite-config" }
recite-fixturegen = { version = "0.1.0", path = "crates/recite-fixturegen" }
recite-godot = { version = "0.1.0", path = "crates/recite-godot" }
recite-lsp = { version = "0.1.0", path = "crates/recite-lsp" }
recite-runtime = { version = "0.1.0", path = "crates/recite-runtime" }
recite-ui = { version = "0.1.0", path = "crates/recite-ui" }
blake3 = "1.8.5"
dirs = "6.0.0"
# Maintained BSD-3-Clause atomic replacement primitive for Unix and Windows.
atomic-write-file = "0.3.1"
clap = { version = "4.5.51", features = ["derive", "string"] }
compact_str = "0.8.1"
criterion = { version = "0.8.2", default-features = false, features = ["plotters"] }
crossterm = "0.28.1"
fluent-bundle = "0.15.3"
fluent-syntax = "0.11.1"
insta = { version = "1.47.2", default-features = false }
notify = "8.2.0"
ratatui = "0.29.0"
rand_chacha = { version = "0.10.0", default-features = false }
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde-value = "0.7.0"
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
tempfile = "3.23.0"
thiserror = "2"
toml = "0.9.8"
toml_edit = { version = "0.25.12", features = ["serde"] }
unic-langid = { version = "0.9.6", features = ["macros"] }
unicode-ident = "1.0.22"
# Unicode normalization for conservative case-insensitive output identities.
unicode-normalization = "0.1.25"
# Full Unicode case folding for conservative case-insensitive output identities.
unicase = "=2.7.0"
