language = "C"
include_guard = "RECITE_H"
cpp_compat = true
style = "type"
usize_is_size_t = true
documentation = true
documentation_style = "auto"
tab_width = 4
line_length = 100
autogen_warning = "/* Generated by scripts/generate-ffi-header.sh. Do not edit by hand. */"

include_version = true
after_includes = """
#define RECITE_OK RECITE_STATUS_OK
#define RECITE_ERR_VALIDATION RECITE_STATUS_VALIDATION
#define RECITE_ERR_ASSET_LOAD_OR_DECODE RECITE_STATUS_ASSET_LOAD_OR_DECODE
#define RECITE_ERR_STALE_OR_INCOMPATIBLE RECITE_STATUS_STALE_OR_INCOMPATIBLE
#define RECITE_ERR_SCHEMA_MISMATCH RECITE_STATUS_SCHEMA_MISMATCH
#define RECITE_ERR_NO_ACTIVE_SESSION RECITE_STATUS_NO_ACTIVE_SESSION
#define RECITE_ERR_SESSION_ALREADY_ACTIVE RECITE_STATUS_SESSION_ALREADY_ACTIVE
#define RECITE_ERR_UNKNOWN_START_BLOCK RECITE_STATUS_UNKNOWN_START_BLOCK
#define RECITE_ERR_INVALID_CHOICE RECITE_STATUS_INVALID_CHOICE
#define RECITE_ERR_UNAVAILABLE_CHOICE RECITE_STATUS_UNAVAILABLE_CHOICE
#define RECITE_ERR_STALE_CHOICE RECITE_STATUS_STALE_CHOICE
#define RECITE_ERR_MISSING_CONDITION_HANDLER RECITE_STATUS_MISSING_CONDITION_HANDLER
#define RECITE_ERR_CONDITION_EVALUATION RECITE_STATUS_CONDITION_EVALUATION
#define RECITE_ERR_INVALID_CONDITION_RESULT RECITE_STATUS_INVALID_CONDITION_RESULT
#define RECITE_ERR_EFFECT_ACKNOWLEDGEMENT RECITE_STATUS_EFFECT_ACKNOWLEDGEMENT
#define RECITE_ERR_REJECTED_REFRESH RECITE_STATUS_REJECTED_REFRESH
#define RECITE_ERR_SAVE_LOAD_INCOMPATIBILITY RECITE_STATUS_SAVE_LOAD_INCOMPATIBILITY
#define RECITE_ERR_LOCALISATION RECITE_STATUS_LOCALISATION
#define RECITE_ERR_MISSING_PROJECTION_HANDLER RECITE_STATUS_MISSING_PROJECTION_HANDLER
#define RECITE_ERR_PROJECTION_EVALUATION RECITE_STATUS_PROJECTION_EVALUATION
#define RECITE_ERR_INVALID_PROJECTION_RESULT RECITE_STATUS_INVALID_PROJECTION_RESULT
#define RECITE_ERR_INVALID_HANDLE RECITE_STATUS_INVALID_HANDLE
#define RECITE_ERR_DIALOGUE_FAULT RECITE_STATUS_DIALOGUE_FAULT
"""

[parse]
parse_deps = false

[export]
include = [
    "ReciteBuffer",
    "ReciteConditionFn",
    "ReciteConditionQuery",
    "ReciteConditionResult",
    "ReciteInterpolationValue",
    "ReciteInterpolationValueKind",
    "ReciteLocaleAttempt",
    "ReciteLocaleAttemptOutcome",
    "ReciteLocaleFn",
    "ReciteLocaleQuery",
    "ReciteLocaleRequestKind",
    "ReciteLocaleResult",
    "ReciteLocaleTextDomain",
    "ReciteStatus",
    "RECITE_FFI_VERSION_MAJOR",
    "RECITE_FFI_VERSION_MINOR",
    "RECITE_FFI_VERSION_PATCH",
    "recite_asset_free",
    "recite_asset_load",
    "recite_buffer_free",
    "recite_last_error_message",
    "recite_locale_evaluate_plural_rule",
    "recite_locale_validate_plural_rule",
    "recite_locale_validate_translation_placeholders",
    "recite_session_acknowledge_effect",
    "recite_session_begin",
    "recite_session_choose",
    "recite_session_create",
    "recite_session_create_with_values",
    "recite_session_free",
    "recite_session_register_condition",
    "recite_session_restore",
    "recite_session_restore_with_values",
    "recite_session_restore_with_values_and_locale_provider",
    "recite_session_restore_with_values_and_locale_provider_and_variant",
    "recite_session_set_locale_provider",
    "recite_session_clear_locale_provider",
    "recite_session_set_locale_variant",
    "recite_session_set_interpolation_values",
    "recite_session_snapshot",
    "recite_session_start",
    "recite_session_start_with_locale_provider",
    "recite_session_start_with_locale_provider_and_variant",
    "recite_session_start_with_values",
    "recite_session_start_with_values_and_locale_provider",
    "recite_session_start_with_values_and_locale_provider_and_variant",
]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[fn]
sort_by = "Name"
