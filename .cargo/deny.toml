# Review dependency licenses and sources for the MIT OR Apache-2.0 distribution.
# No advisory exceptions are accepted by default. Vulnerabilities and yanked crates fail
# everywhere in the graph; unmaintained notices fail only for direct workspace dependencies,
# because transitive ones wait on upstream; `just release dependency-review` lists them for release.
[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "deny"
# harper-core 3.2.0 requires zip 8.x and uses it only to read and write Weirpack archives in
# memory; it never extracts archives, and Recite never loads a Weirpack, so these zip 8.6.0
# extraction and decoding advisories are unreachable. Remove them with the zip 9 bump in
# Automattic/harper#4748; unused-ignored-advisory fails as soon as they stop matching (#318).
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip via harper-core: extraction is never used (#318)" },
    { id = "RUSTSEC-2026-0368", reason = "zip via harper-core: extraction is never used (#318)" },
    { id = "RUSTSEC-2026-0369", reason = "zip via harper-core: extraction is never used (#318)" },
    { id = "RUSTSEC-2026-0429", reason = "zip via harper-core: extraction is never used (#318)" },
    { id = "RUSTSEC-2026-0545", reason = "zip via harper-core: no encrypted archives are read (#318)" },
    { id = "RUSTSEC-2026-0546", reason = "zip via harper-core: extraction is never used (#318)" },
    { id = "RUSTSEC-2026-0547", reason = "zip via harper-core: Recite reads no archives through it (#318)" },
    { id = "RUSTSEC-2026-0548", reason = "zip via harper-core: the stream reader is never used (#318)" },
]

[bans]
multiple-versions = "warn"
# Unpublished workspaces such as Writer follow the core crates by path, without a version pin.
allow-wildcard-paths = true
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Existing, unmodified MPL dependencies remain separately licensed; see
# https://www.mozilla.org/en-US/MPL/2.0/FAQ/ (larger works).
exceptions = [
    { crate = "gdextension-api", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-bindings", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-cell", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-codegen", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-core", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-ffi", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-macros", allow = [
        "MPL-2.0",
    ] },
    { crate = "option-ext", allow = [
        "MPL-2.0",
    ] },
    # Required by harper-core for prose checking (#274): `colored` through harper-brill's burn,
    # `cssparser` and `dtoa-short` through ammonia. Unmodified, as above.
    { crate = "colored", allow = [
        "MPL-2.0",
    ] },
    { crate = "cssparser", allow = [
        "MPL-2.0",
    ] },
    { crate = "dtoa-short", allow = [
        "MPL-2.0",
    ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Writer toolkit forks carrying Recite fixes; each pins a rev and documents itself in RECITE.md.
allow-git = [
    "https://github.com/plethu/accesskit",
    "https://github.com/plethu/copypasta",
    "https://github.com/plethu/xilem",
]
