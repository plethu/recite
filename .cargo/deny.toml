# Review dependency licenses and sources for the MIT OR Apache-2.0 distribution.
# No advisory exceptions are accepted by default. Vulnerabilities and yanked crates fail
# everywhere in the graph; unmaintained notices fail only for direct workspace dependencies,
# because transitive ones wait on upstream; `just release dependency-review` lists them for release.
[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Existing, unmodified MPL dependencies remain separately licensed; see
# https://www.mozilla.org/en-US/MPL/2.0/FAQ/ (larger works).
exceptions = [
    { crate = "gdextension-api", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-bindings", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-cell", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-codegen", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-core", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-ffi", allow = [
        "MPL-2.0",
    ] },
    { crate = "godot-macros", allow = [
        "MPL-2.0",
    ] },
    { crate = "option-ext", allow = [
        "MPL-2.0",
    ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Writer toolkit forks carrying Recite fixes; each pins a rev and documents itself in RECITE.md.
allow-git = [
    "https://github.com/plethu/accesskit",
    "https://github.com/plethu/copypasta",
    "https://github.com/plethu/xilem",
]
