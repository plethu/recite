[package]
name = "recite-godot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Godot 4 GDExtension adapter for Recite dialogue runtime."
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.5.3", features = ["api-4-6"] }
recite-core.workspace = true
recite-runtime.workspace = true
thiserror.workspace = true

[dev-dependencies]
recite-compiler.workspace = true

[lints.rust]
unsafe_code = "allow"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
