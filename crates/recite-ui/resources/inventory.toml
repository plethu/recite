# Shared UI resource inventory. `message_ids.rs` is the typed ID registry;
# this file records client ownership and launch/support policy in a reviewable
# format. Static IDs live in `en-US.ftl`; active diagnostic explanation-slot
# IDs live in `diagnostics.ftl`. The conformance gate requires every active
# ID to resolve through the combined launch resource.
