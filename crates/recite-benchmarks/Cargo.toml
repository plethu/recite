[package]
name = "recite-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Benchmark fixtures, drivers, and report generation for Recite."

[lib]
name = "recite_benchmarks"
path = "src/lib.rs"
bench = false

[[bench]]
name = "compiler"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "lsp"
harness = false

[dependencies]
blake3.workspace = true
recite-compiler = { workspace = true, features = ["bench-support"] }
recite-core.workspace = true
recite-fixturegen.workspace = true
recite-lsp = { workspace = true, features = ["bench-support"] }
recite-parser.workspace = true
recite-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
stats_alloc = "0.1.10"
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[lints]
workspace = true
