[package]
name = "recite-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Benchmark fixtures, drivers, and report generation for Recite."
repository.workspace = true
license.workspace = true

[lib]
bench = false
name = "recite_benchmarks"
path = "src/lib.rs"

[[bench]]
harness = false
name = "compiler"

[[bench]]
harness = false
name = "runtime"

[[bench]]
harness = false
name = "preview"

[[bench]]
harness = false
name = "lsp"

[dependencies]
blake3.workspace = true
recite-compiler = { workspace = true, features = ["bench-support"] }
recite-core.workspace = true
recite-fixturegen.workspace = true
recite-lsp = { workspace = true, features = ["bench-support"] }
recite-parser.workspace = true
recite-runtime = { workspace = true, features = ["bench-support"] }
serde.workspace = true
serde_json.workspace = true
stats_alloc = "0.1.10"
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[lints]
workspace = true
