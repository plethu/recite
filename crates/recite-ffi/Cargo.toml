[package]
name = "recite-ffi"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
# rlib is included for the integration test harness only and is not a distributed artifact.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
recite-adapter = { workspace = true }
recite-core = { workspace = true }
recite-runtime = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }

[dev-dependencies]
recite-compiler = { workspace = true }
rmp-serde = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

[lints.rust]
unsafe_code = "allow"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
